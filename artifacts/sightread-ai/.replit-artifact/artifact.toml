kind = "web"
previewPath = "/"
title = "SightRead AI"
description = "An AI-powered sight-reading practice app where musicians can open a valid MusicXML score, view professional sheet music, play it back, adjust tempo, navigate measures, and loop difficult passages."
version = "1.0.0"
id = "artifacts/sightread-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18449

[services.development]
run = "pnpm --filter @workspace/sightread-ai run dev"

[services.production]

[services.production.build]
args = [ "sh", "-c", "export PORT=${PORT:-5173}; export BASE_PATH=/; pnpm --filter @workspace/sightread-ai run build && pnpm --filter @workspace/api-server run build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "18449"
BASE_PATH = "/"
